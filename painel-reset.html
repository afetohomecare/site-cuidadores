<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova senha — Afeto</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root { --lilas: #8b5cf6; --lilas-escuro: #7c3aed; --fundo-site: #f8f9fc; --preto-fonte: #1f1f1f; --cinza-fonte: #666666; --cinza-azulado: #94a3b8; --branco: #ffffff; --verde: #10b981; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Nunito', sans-serif; background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%); color: var(--preto-fonte); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

.reset-wrap { max-width: 440px; width: 100%; }

.reset-header { text-align: center; margin-bottom: 30px; }
.reset-header .logo { display: inline-flex; align-items: center; gap: 0.16em; font-weight: 900; font-size: 32px; color: var(--lilas); text-decoration: none; line-height: 1; margin-bottom: 16px; }
.reset-header .logo svg { width: 1.11em; height: 0.69em; overflow: visible; }
.reset-header .logo svg path { fill: none; stroke: currentColor; stroke-width: 13; stroke-linecap: round; }
.reset-header h1 { font-size: 24px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 8px; line-height: 1.2; }
.reset-header p { font-size: 14px; color: var(--cinza-fonte); font-weight: 700; line-height: 1.55; }

.reset-card { background: white; border-radius: 28px; padding: 36px 32px; box-shadow: 0 25px 60px rgba(139,92,246,0.1); border: 1px solid #e2e8f0; }

.campo { margin-bottom: 18px; }
.campo label { display: block; font-weight: 800; margin-bottom: 8px; font-size: 13.5px; color: var(--preto-fonte); }
.campo input { width: 100%; padding: 15px 18px; border-radius: 14px; border: 2px solid #e2e8f0; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; background: var(--fundo-site); color: var(--preto-fonte); outline: none; transition: 0.3s; }
.campo input:focus { border-color: var(--lilas); background: white; box-shadow: 0 0 0 4px rgba(139,92,246,0.12); }

.campo-senha { position: relative; }
.campo-senha input { padding-right: 50px; }
.campo-senha .olho { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--cinza-azulado); font-size: 16px; cursor: pointer; padding: 6px; }
.campo-senha .olho:hover { color: var(--lilas-escuro); }

.btn-salvar { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--lilas), var(--lilas-escuro)); color: white; border: none; border-radius: 50px; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 900; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px rgba(139,92,246,0.3); display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 8px; }
.btn-salvar:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(139,92,246,0.45); }
.btn-salvar:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

.aviso { border-radius: 14px; padding: 14px 16px; font-size: 13.5px; font-weight: 700; margin-bottom: 18px; display: none; line-height: 1.5; }
.aviso.ativo { display: block; animation: fadeIn 0.3s ease; }
.aviso.erro { background: linear-gradient(135deg, #fef2f2, #fee2e2); border: 1px solid #fecaca; color: #991b1b; }
.aviso.sucesso { background: linear-gradient(135deg, #ecfdf5, #d1fae5); border: 1px solid #6ee7b7; color: #065f46; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

.rodape { text-align: center; margin-top: 24px; font-size: 13px; color: var(--cinza-fonte); font-weight: 700; }
.rodape a { color: var(--lilas-escuro); text-decoration: none; font-weight: 800; }
</style>
</head>
<body>

<div class="reset-wrap">

  <div class="reset-header">
    <a href="index.html" class="logo" aria-label="Afeto">
      <svg viewBox="9.5 15.5 111 69" aria-hidden="true" focusable="false">
        <path d="M71.87 52.72 A28 28 0 1 0 50.20 77.30"/>
        <path d="M79.80 22.70 A28 28 0 1 1 58.13 47.28"/>
      </svg>
      <span>Afeto</span>
    </a>
    <h1>Definir nova senha 🔐</h1>
    <p>Escolha uma senha nova pra acessar seu painel.</p>
  </div>

  <div class="reset-card">

    <div id="aviso" class="aviso erro"></div>

    <div id="area-form">
      <form id="form-reset" novalidate>

        <div class="campo campo-senha">
          <label for="senha">Nova senha (mínimo 8 caracteres)</label>
          <input type="password" id="senha" placeholder="Digite sua nova senha" minlength="8" maxlength="100" autocomplete="new-password" required>
          <button type="button" class="olho" id="olho-1" aria-label="Mostrar senha">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>

        <div class="campo campo-senha">
          <label for="senha2">Confirme a nova senha</label>
          <input type="password" id="senha2" placeholder="Digite de novo" minlength="8" maxlength="100" autocomplete="new-password" required>
          <button type="button" class="olho" id="olho-2" aria-label="Mostrar senha">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>

        <button type="submit" id="btn-salvar" class="btn-salvar">
          Salvar nova senha <i class="fa-solid fa-check"></i>
        </button>

      </form>
    </div>

  </div>

  <div class="rodape">
    <a href="painel-login.html">Voltar pra tela de login</a>
  </div>

</div>

<script>
(function() {
  "use strict";

  var aviso = document.getElementById('aviso');
  var form = document.getElementById('form-reset');
  var btn = document.getElementById('btn-salvar');
  var senhaInput = document.getElementById('senha');
  var senha2Input = document.getElementById('senha2');
  var areaForm = document.getElementById('area-form');

  function mostrarAviso(msg, tipo) {
    aviso.textContent = msg;
    aviso.className = 'aviso ativo ' + (tipo || 'erro');
  }

  var params = new URLSearchParams(window.location.search);
  var token = (params.get('token') || '').trim();

  if (!token || token.length !== 64) {
    mostrarAviso('Link inválido. Solicite uma nova recuperação de senha.', 'erro');
    areaForm.style.display = 'none';
    return;
  }

  function ligarOlho(idBtn, idInput) {
    var b = document.getElementById(idBtn);
    var i = document.getElementById(idInput);
    if (!b || !i) return;
    b.addEventListener('click', function() {
      if (i.type === 'password') {
        i.type = 'text';
        b.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
      } else {
        i.type = 'password';
        b.innerHTML = '<i class="fa-solid fa-eye"></i>';
      }
    });
  }
  ligarOlho('olho-1', 'senha');
  ligarOlho('olho-2', 'senha2');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    var senha = senhaInput.value;
    var senha2 = senha2Input.value;

    if (!senha || senha.length < 8) {
      mostrarAviso('A senha precisa ter no mínimo 8 caracteres.', 'erro');
      senhaInput.focus();
      return;
    }
    if (senha !== senha2) {
      mostrarAviso('As senhas não batem. Digite de novo.', 'erro');
      senha2Input.focus();
      return;
    }

    btn.disabled = true;
    btn.innerHTML = 'Salvando... <i class="fa-solid fa-spinner fa-spin"></i>';

    try {
      var resp = await fetch('/api/auth/resetar-senha', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, nova_senha: senha })
      });

      var data = await resp.json();

      if (!resp.ok || !data.ok) {
        mostrarAviso(data.error || 'Não foi possível salvar. Tente novamente.', 'erro');
        btn.disabled = false;
        btn.innerHTML = 'Salvar nova senha <i class="fa-solid fa-check"></i>';
        return;
      }

      mostrarAviso('✅ Senha atualizada! Redirecionando pro login...', 'sucesso');
      areaForm.style.display = 'none';

      setTimeout(function() {
        window.location.href = 'painel-login.html';
      }, 1800);

    } catch (err) {
      console.error('Erro reset:', err);
      mostrarAviso('Erro de conexão. Tente novamente em alguns instantes.', 'erro');
      btn.disabled = false;
      btn.innerHTML = 'Salvar nova senha <i class="fa-solid fa-check"></i>';
    }
  });

})();
</script>

</body>
</html>
